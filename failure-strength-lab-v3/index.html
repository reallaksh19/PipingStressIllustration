<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Failure & Strength Lab</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./learning-center-fallback.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <details class="fallback-learning-panel" id="fallback-learning-panel" hidden>
      <summary>
        <div style="min-width:0">
          <div class="fallback-learning-kicker">ⓘ Learning Center</div>
          <div class="fallback-learning-title" id="fallback-learning-title">Learning Center</div>
        </div>
        <span class="fallback-learning-action"><span class="open-label">▼ Open panel</span><span class="close-label">▲ Collapse to bottom</span></span>
      </summary>
      <div class="fallback-learning-body">
        <div class="fallback-learning-head">
          <div style="min-width:0">
            <h3 id="fallback-learning-heading">Learning Center</h3>
            <p id="fallback-learning-subtitle">Focused concept, piping, B31.3 map, mistake, and next-step guidance.</p>
          </div>
          <span class="fallback-route">wide bottom panel</span>
        </div>
        <div class="fallback-helper-grid" id="fallback-learning-grid"></div>
      </div>
    </details>
    <script src="./learning-center-fallback.js" defer></script>
  </body>
</html>
